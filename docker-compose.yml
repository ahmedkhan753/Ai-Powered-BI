version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: bi-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d bi_warehouse" ]
      interval: 10s
      timeout: 5s
      retries: 5

  clean-warehouse-postgres:
    image: postgres:15-alpine
    container_name: clean-warehouse-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_CLEAN} # default DB
    ports:
      - "5434:5432"
    volumes:
      - clean_warehouse_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d bi_warehouse_clean" ]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-webserver:
    image: apache/airflow:2.9.3
    container_name: airflow-webserver
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${RAW_DB_HOST}:${RAW_DB_PORT}/${POSTGRES_DB}
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      PYTHONPATH: "${AIRFLOW_PROJ_DIR}:${PYTHONPATH}"
    volumes:
      - ./data_ingestion/dags:/opt/airflow/dags
      - ./data_ingestion/scripts:/opt/airflow/scripts
      - ./source:/opt/airflow/source
      - ./data_transform:/opt/airflow/data_transform
      - ./data_warehouse:/opt/airflow/data_warehouse
      - ./logs:/opt/airflow/logs
    ports:
      - "8080:8080"
    command: webserver
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    image: apache/airflow:2.9.3
    container_name: airflow-scheduler
    depends_on:
      airflow-webserver:
        condition: service_healthy
    env_file: .env
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${RAW_DB_HOST}:${RAW_DB_PORT}/${POSTGRES_DB}
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      PYTHONPATH: "${AIRFLOW_PROJ_DIR}:${PYTHONPATH}"
    volumes:
      - ./data_ingestion/dags:/opt/airflow/dags
      - ./data_ingestion/scripts:/opt/airflow/scripts
      - ./source:/opt/airflow/source
      - ./data_transform:/opt/airflow/data_transform
      - ./data_warehouse:/opt/airflow/data_warehouse
      - ./logs:/opt/airflow/logs
    command: scheduler

  ml-pipeline:
    build:
      context: ./machine_learning_pipeline
      dockerfile: Dockerfile
    container_name: ml-pipeline
    depends_on:
      clean-warehouse-postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file: .env
    environment:
      GOLD_DB_HOST: clean-warehouse-postgres
      GOLD_DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PYTHONPATH: "/app"
    volumes:
      - ./machine_learning_pipeline/logs:/app/logs
      - ./machine_learning_pipeline/models:/app/models
      - ./machine_learning_pipeline/data:/app/data

  ml-api:
    build:
      context: ./machine_learning_pipeline
      dockerfile: Dockerfile
    container_name: ml-api
    command: uvicorn app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./machine_learning_pipeline/models:/app/models
      - ./machine_learning_pipeline/logs:/app/logs

  redis:
    image: redis:7-alpine
    container_name: bi-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  clean_warehouse_data:
