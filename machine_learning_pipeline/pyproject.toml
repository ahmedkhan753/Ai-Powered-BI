[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "machine_learning_pipeline"
version = "0.0.1"
description = "End-to-end ML pipeline for AI-Powered BI"
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
dependencies = [
    "pandas",
    "scikit-learn",
    "sqlalchemy",
    "mlflow",
    "hydra-core",
    "python-dotenv",
    "psycopg2-binary",  # Assuming Postgres for Gold Layer, adjust if needed
]
requires-python = ">=3.9"

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8",
    "isort",
    "pre-commit",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["src"]
